aid: bridgetown-research
name: 'Bridgetown Research'
description: >-
  Bridgetown Research is an AI-powered research and analysis platform that helps
  organizations analyze businesses with speed and precision. Its AI agents conduct
  expert interviews, gather primary and secondary data at scale, and execute 300+
  of the most common analyses to power autonomous market research and commercial
  due diligence. The platform serves private equity and venture capital firms,
  professional services firms, and corporate strategy and development teams, who
  access it either through a SOC 2-compliant SaaS platform with interactive
  generative-search reporting or via an email-driven workflow that returns PDF
  reports. Bridgetown Research also exposes a REST API (documented on Apidog at
  docs.bridgetownresearch.com) for creating research projects and managing experts,
  expert actions, and scheduled calls. It is backed by Accel and Lightspeed Venture
  Partners.
